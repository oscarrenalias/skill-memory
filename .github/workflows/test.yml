name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - name: Cache venv
        uses: actions/cache@v5
        with:
          path: .apm/skills/skill-memory/.venv
          key: venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.apm/skills/skill-memory/memory.py') }}
      - name: Bootstrap venv and install pytest
        run: |
          python .apm/skills/skill-memory/memory.py --help
          .apm/skills/skill-memory/.venv/bin/pip install --quiet pytest
      - name: Run tests
        run: .apm/skills/skill-memory/.venv/bin/pytest tests/

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute new version
        id: version
        run: |
          current=$(grep '^version:' .apm/skills/skill-memory/apm.yml | awk '{print $2}')
          IFS='.' read -r major minor patch <<< "$current"
          patch=$((patch + 1))
          new="${major}.${minor}.${patch}"
          echo "version=${new}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new}" >> "$GITHUB_OUTPUT"
      - name: Update apm.yml
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}/" .apm/skills/skill-memory/apm.yml
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .apm/skills/skill-memory/apm.yml
          git commit -m "chore: release ${{ steps.version.outputs.tag }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD "${{ steps.version.outputs.tag }}"
      - name: Build zip
        run: |
          cd .apm/skills
          zip -r ../../skill-memory-${{ steps.version.outputs.version }}.zip skill-memory \
            --exclude "skill-memory/.venv/*" \
            --exclude "skill-memory/__pycache__/*" \
            --exclude "skill-memory/*.db"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: skill-memory ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: skill-memory-${{ steps.version.outputs.version }}.zip
