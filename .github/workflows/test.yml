name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.12'
      - name: Cache venv
        uses: actions/cache@v5
        with:
          path: .apm/skills/skill-memory/.venv
          key: venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.apm/skills/skill-memory/memory.py') }}
      - name: Bootstrap venv and install pytest
        run: |
          python .apm/skills/skill-memory/memory.py --help
          .apm/skills/skill-memory/.venv/bin/pip install --quiet pytest
      - name: Run tests
        run: .apm/skills/skill-memory/.venv/bin/pytest tests/

  tag:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump patch version, tag, release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -1)
          if [ -z "$latest" ]; then new_tag="v0.1.0"; else
            major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
            minor=$(echo "$latest" | cut -d. -f2)
            patch=$(echo "$latest" | cut -d. -f3)
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi
          git tag "$new_tag" && git push origin "$new_tag"
          version="${new_tag#v}"
          sed -i "s/^version: .*/version: ${version}/" .apm/skills/skill-memory/apm.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .apm/skills/skill-memory/apm.yml
          git commit -m "chore: update apm.yml version to ${new_tag} [skip ci]"
          git push origin HEAD:main
          cd .apm/skills
          zip -r ../../skill-memory-${new_tag}.zip skill-memory \
            --exclude "skill-memory/.venv/*" \
            --exclude "skill-memory/__pycache__/*" \
            --exclude "skill-memory/*.db"
          cd ../..
          gh release create "${new_tag}" \
            --title "skill-memory ${new_tag}" \
            --generate-notes \
            skill-memory-${new_tag}.zip

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build zip and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME}"
          cd .apm/skills
          zip -r ../../skill-memory-${version}.zip skill-memory \
            --exclude "skill-memory/.venv/*" \
            --exclude "skill-memory/__pycache__/*" \
            --exclude "skill-memory/*.db"
          cd ../..
          gh release create "${version}" \
            --title "skill-memory ${version}" \
            --generate-notes \
            skill-memory-${version}.zip
